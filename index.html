<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Model Viewer with AR</title>

  <!-- Model Viewer library -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 90vh;
    }

    .ar-hint {
      text-align: center;
      padding: 10px;
      background: #f0f0f0;
      font-size: 14px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- 3D Model Viewer with AR -->
  <model-viewer 
    src="model.glb"
    ios-src="model.usdz"
    alt="3D model"
    ar
    ar-modes="scene-viewer quick-look webxr"
    auto-rotate
    camera-controls
    shadow-intensity="1"
    exposure="1"
    style="width:100vw; height:90vh;">
  </model-viewer>

  <!-- Petunjuk -->
  <div class="ar-hint">
    📱 Gunakan dua jari untuk zoom 🔍 – Tap tombol <b>"AR"</b> di bawah untuk melihat model langsung di ruang nyata!
  </div>

</body>
</html>
